name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck bin/*.sh install.sh

      - name: script tests
        run: bin/run-tests.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: validate the plugin and the marketplace
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json

  # Evals call the model on the account behind ANTHROPIC_API_KEY, so they run only on
  # demand. Set the secret in the repository settings before dispatching.
  evals:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: checks
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: run the eval suite
        run: |
          claude plugin eval . \
            --trust-plugin \
            --json results.json \
            --threshold 0.8 \
            --no-publish \
            --max-cost-usd 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results.json
            evals/results/
